services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: playerpro
      POSTGRES_USER: playerpro
      POSTGRES_PASSWORD: playerpro
    ports:
      - "5433:5432"  # 5432 на хосте часто занят другими проектами
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U playerpro"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
