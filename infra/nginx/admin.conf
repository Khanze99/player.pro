# admin.player-pro.ru — кабинет тренера/врача (docs/plan-web-admin.md), полностью
# динамический Next.js-сервер (сервис admin, docker-compose.stand.yml), в отличие
# от app.player-pro.ru здесь нет статики — весь трафик проксируется на admin:3000.
#
# BFF: сам admin ходит в api по внутренней docker-сети (API_URL=http://api:8000),
# браузер к api никогда не обращается напрямую — CORS не нужен ни тут, ни на бэкенде.
#
# Этот файл — вариант на :80 (работает сразу, до сертификата). После выпуска
# сертификата (docs/deploy.md, шаг 5) заменить на templates/admin-tls.conf —
# тот же процесс, что и у playerpro.conf/templates/playerpro-tls.conf.

server {
    listen 80;
    server_name admin.player-pro.ru;

    resolver 127.0.0.11 valid=10s;
    set $admin "http://admin:3000";

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Выпуск и продление сертификата Let's Encrypt (webroot) ---
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass $admin;
        client_max_body_size 1m;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
}
