# TLS-версия landing.conf — применять ПОСЛЕ выпуска сертификата (docs/deploy.md, шаг 5):
#
#   cp infra/nginx/templates/landing-tls.conf infra/nginx/landing.conf
#   docker compose -f infra/docker-compose.stand.yml --env-file infra/.env exec nginx nginx -s reload
#
# Лежит в templates/ по той же причине, что playerpro-tls.conf/admin-tls.conf — до
# выпуска сертификата ssl_certificate указывает на несуществующий файл, nginx не
# стартует, если это лежит прямо в conf.d.

server {
    listen 80;
    server_name player-pro.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name player-pro.ru;

    ssl_certificate     /etc/letsencrypt/live/player-pro.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/player-pro.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /srv/landing;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=15768000" always;
}
