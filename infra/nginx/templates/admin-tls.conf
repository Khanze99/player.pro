# TLS-версия admin.conf — применять ПОСЛЕ выпуска сертификата (docs/deploy.md, шаг 5):
#
#   cp infra/nginx/templates/admin-tls.conf infra/nginx/admin.conf
#   docker compose -f infra/docker-compose.stand.yml --env-file infra/.env exec nginx nginx -s reload
#
# Лежит в templates/ по той же причине, что playerpro-tls.conf — см. комментарий там.
# Куки сессии (web/src/lib/cookies.ts, sessionCookieOptions) ставятся с Secure=true
# при NODE_ENV=production — без HTTPS браузер их не примет, TLS для этого домена
# не опционален так же, как для app.player-pro.ru.

server {
    listen 80;
    server_name admin.player-pro.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name admin.player-pro.ru;

    ssl_certificate     /etc/letsencrypt/live/admin.player-pro.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.player-pro.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    resolver 127.0.0.11 valid=10s;
    set $admin "http://admin:3000";

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass $admin;
        client_max_body_size 1m;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=15768000" always;
}
