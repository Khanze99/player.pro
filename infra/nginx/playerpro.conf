# app.player-pro.ru — статика веб-PWA + reverse-proxy API/WS на бэкенд (same-origin).
#
# Один origin для приложения и API: браузер не делает cross-origin запросов,
# поэтому CORS не нужен, а mixed content невозможен. EXPO_PUBLIC_API_URL веб-сборки
# = https://app.player-pro.ru, клиент сам добавляет префикс /api/v1 (src/api/client.ts).
#
# Подключается сервисом nginx в infra/docker-compose.stand.yml (профиль web:
# COMPOSE_PROFILES=web в infra/.env). Механика выкладки бандла и переезд на TLS —
# docs/deploy.md, шаги 4b и 5. Этот файл — вариант на :80 (работает сразу, до
# сертификата). После выпуска сертификата :80 превращается в редирект, содержимое
# переносится в блок :443 — см. docs/deploy.md, шаг 5.

server {
    listen 80;
    server_name app.player-pro.ru;

    # Резолвер Docker + upstream через переменную: nginx стартует, даже если контейнер
    # api в этот момент недоступен (иначе literal-host в proxy_pass роняет старт nginx).
    resolver 127.0.0.11 valid=10s;
    set $api "http://api:8000";

    # Общие заголовки для proxy_pass ниже. Наследуются в location, КРОМЕ тех,
    # где есть свой proxy_set_header (там повторяем — см. /ws).
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Выпуск и продление сертификата Let's Encrypt (webroot) ---
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # --- Бэкенд: API, healthcheck, гербы организаций, Swagger ---
    location /api/ {
        proxy_pass $api;
        client_max_body_size 2m;   # аватар по мобильной сети (docs/plan-profile.md)
    }
    location = /health {
        proxy_pass $api;
    }
    location /static/ {
        proxy_pass $api;           # публичные гербы клубов (docs/plan-org-branding.md)
    }
    location /docs {
        # На публичном стенде Swagger обычно закрывают — см. чек-лист docs/deploy.md
        proxy_pass $api;
    }
    location = /openapi.json {
        proxy_pass $api;
    }

    # --- WebSocket дашборда (раздел 10 ТЗ; на бэкенде ещё не реализован) ---
    location /ws {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # --- Веб-PWA: статика Expo (output: single) + SPA-фолбэк ---
    root /srv/web;
    index index.html;

    # Хэшированные ассеты Expo иммутабельны. add_header внутри location заменяет,
    # а не дополняет серверный набор — поэтому nosniff повторяем здесь.
    location /_expo/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    # Оболочку и манифест не кэшируем — выкатка подхватывается сразу
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    # Всё остальное — клиентская маршрутизация expo-router
    location / {
        try_files $uri /index.html;
    }

    # Базовые заголовки безопасности. CSP подобрать под inline-бутстрап Expo
    # (без сторонних origin) — задача security-auditor, этап 7 плана.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
}
