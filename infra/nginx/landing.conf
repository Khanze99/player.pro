# player-pro.ru — сайт-визитка (статический лендинг, landing/index.html в корне
# репозитория). В отличие от app.player-pro.ru и admin.player-pro.ru, этому домену
# нечего проксировать — чистая статика без бэкенда.
#
# landing/ коммитится в git как обычный исходник (не build-артефакт вроде infra/web/):
# обновление — git pull на сервере, без пересборки и rsync.
#
# Этот файл — вариант на :80 (работает сразу, до сертификата). После выпуска
# TLS-сертификата (docs/deploy.md, шаг 5) заменить на templates/landing-tls.conf —
# тот же процесс, что у playerpro.conf/admin.conf.

server {
    listen 80;
    server_name player-pro.ru;

    # --- Выпуск и продление сертификата Let's Encrypt (webroot) ---
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /srv/landing;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
}
