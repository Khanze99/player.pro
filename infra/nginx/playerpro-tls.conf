# TLS-версия playerpro.conf — применять ПОСЛЕ выпуска сертификата (docs/deploy.md, шаг 5):
#
#   cp infra/nginx/playerpro-tls.conf infra/nginx/playerpro.conf
#   docker compose -f infra/docker-compose.stand.yml --env-file infra/.env exec nginx nginx -s reload
#
# До сертификата этот файл не загрузится (ssl_certificate не существует) — держим
# отдельно, а не в playerpro.conf.

# --- :80 — только ACME-челлендж и редирект на HTTPS ---
server {
    listen 80;
    server_name app.player-pro.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- :443 — приложение + API ---
server {
    listen 443 ssl;
    http2 on;
    server_name app.player-pro.ru;

    ssl_certificate     /etc/letsencrypt/live/app.player-pro.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.player-pro.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Резолвер Docker + upstream через переменную: nginx стартует, даже если контейнер
    # api в этот момент недоступен (иначе literal-host в proxy_pass роняет старт nginx).
    resolver 127.0.0.11 valid=10s;
    set $api "http://api:8000";

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # --- Бэкенд: API, healthcheck, гербы организаций, Swagger ---
    location /api/ {
        proxy_pass $api;
        client_max_body_size 2m;
    }
    location = /health {
        proxy_pass $api;
    }
    location /static/ {
        proxy_pass $api;
    }
    location /docs {
        proxy_pass $api;
    }
    location = /openapi.json {
        proxy_pass $api;
    }

    # --- WebSocket дашборда (раздел 10 ТЗ; на бэкенде ещё не реализован) ---
    location /ws {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }

    # --- Веб-PWA: статика Expo (output: single) + SPA-фолбэк ---
    root /srv/web;
    index index.html;

    location /_expo/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /manifest.json {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri /index.html;
    }

    # Базовые заголовки безопасности. CSP — задача security-auditor, этап 7 плана.
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=15768000" always;  # полгода; поднять после проверки
}
